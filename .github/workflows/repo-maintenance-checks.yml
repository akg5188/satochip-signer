name: Repo Maintenance Checks

on:
  push:
  pull_request:

jobs:
  repo-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run repository consistency checks
        run: bash scripts/check_repo_consistency.sh

      - name: Run release artifact checks
        run: STRICT_MISSING_RELEASE_ARTIFACTS=0 bash scripts/check_release_artifacts.sh
